name: Apply research dashboard refinement

on:
  push:
    branches: [mostafasameer-transportation]

permissions:
  contents: write

concurrency:
  group: apply-research-refinement
  cancel-in-progress: false

jobs:
  refine:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Apply robust HTML refinement
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          p = Path('index.html')
          s = p.read_text(encoding='utf-8')

          s = s.replace(
              'Interpretable Network Metrics for Equity-Aware Bridge Prioritization — Sensitivity Tool',
              'Weight &amp; Influencing-Factor Sensitivity Tool — NY-04 Bridge Prioritization', 1
          )

          css = '''
          /* ---- 2026 research-dashboard refinement ---- */
          :root{--shadow:0 8px 24px rgba(8,30,63,.07);--shadow-soft:0 3px 12px rgba(8,30,63,.055);}
          body{max-width:1320px;padding:0 34px 72px;}
          .fiu-banner{margin:0 -34px;padding:10px 34px;min-height:58px;}
          .masthead{padding:30px 0 24px;}
          .kicker{letter-spacing:.12em;font-size:12px;}
          .thesis-title{font-size:34px;line-height:1.12;max-width:1080px;margin:10px 0 9px;}
          .tool-name{font-size:19px;margin:0 0 17px;}
          .institution-block{box-shadow:var(--shadow-soft);border:1px solid var(--line);}
          .institution-block td{padding:9px 12px;}
          .subtitle{font-size:15px;line-height:1.62;max-width:1110px;margin:19px 0 6px;}
          .byline{font-size:12.5px;margin-top:9px;}
          .datanote{border-left-width:4px;box-shadow:var(--shadow-soft);font-size:13px;line-height:1.65;padding:14px 18px;margin:4px 0 18px;}
          .data-status-row{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px;}
          .data-status{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--line);background:#fff;padding:5px 9px;border-radius:999px;font-size:11px;font-style:normal;color:var(--steel);}
          .data-status .dot{width:7px;height:7px;border-radius:50%;display:inline-block;background:var(--steel);}
          .data-status.synthetic .dot{background:var(--accent);}
          .method-strip{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:18px 0 20px;}
          .method-card{background:rgba(255,255,255,.88);border:1px solid var(--line);border-top:3px solid var(--steel);padding:12px 14px;box-shadow:var(--shadow-soft);min-height:82px;}
          .method-card .m-kicker{font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:#6b6255;margin-bottom:5px;}
          .method-card .m-title{font-weight:700;color:var(--steel);font-size:14px;line-height:1.25;}
          .method-card .m-text{font-size:11.5px;color:#5f5a50;line-height:1.45;margin-top:4px;}
          .presetbar{background:rgba(255,255,255,.78);border:1px solid var(--line);padding:11px 12px;box-shadow:var(--shadow-soft);}
          .preset{transition:transform .12s ease,box-shadow .12s ease,background .12s ease;}
          .preset:hover{transform:translateY(-1px);box-shadow:0 3px 8px rgba(8,30,63,.08);}
          .layout{gap:22px;align-items:start;}
          #controls{position:sticky;top:14px;box-shadow:var(--shadow);}
          .panel{box-shadow:var(--shadow-soft);}
          .stats-row{gap:10px;}
          .stat{box-shadow:var(--shadow-soft);min-height:92px;}
          .tabbar{box-shadow:0 1px 0 rgba(8,30,63,.04);}
          .table-controls{gap:14px;align-items:end;}
          .tc-item select,.tc-item input[type=text]{border-radius:4px;min-height:34px;}
          #csv-btn{font-weight:700;}
          .viz-card{box-shadow:var(--shadow-soft);}
          footer{max-width:none;padding:16px 2px 0;}
          @media(max-width:1050px){.method-strip{grid-template-columns:repeat(2,1fr);}#controls{position:static;}.thesis-title{font-size:30px;}}
          @media(max-width:700px){body{padding:0 16px 48px;}.fiu-banner{margin:0 -16px;padding:9px 16px;}.fiu-banner .fiu-tag{display:none;}.thesis-title{font-size:25px;}.tool-name{font-size:17px;}.method-strip{grid-template-columns:1fr;}.stats-row{grid-template-columns:repeat(2,1fr);}}
          '''
          if '2026 research-dashboard refinement' not in s:
              if '</style>' not in s:
                  raise SystemExit('style closing tag not found')
              s = s.replace('</style>', css + '\n</style>', 1)

          status = '''
          <div class="data-status-row" aria-label="Data status">
            <span class="data-status"><span class="dot"></span>Real / sourced: Condition, Region, County, Owner, Age</span>
            <span class="data-status synthetic"><span class="dot"></span>Illustrative / simulated: AADT, Truck %, Detour, Scour, Fracture-Critical, Material Risk, Equity Index</span>
          </div>
          '''
          if 'data-status-row' not in s:
              # Put the status directly after the main data note, before the presets.
              m = re.search(r'(</div>\s*)(<div[^>]+class=["\']presetbar["\'])', s, flags=re.I)
              if not m:
                  raise SystemExit('presetbar insertion point not found')
              pos = m.start(2)
              s = s[:pos] + status + '\n' + s[pos:]

          method = '''
          <div class="method-strip" aria-label="Research tool overview">
            <div class="method-card"><div class="m-kicker">Source framework</div><div class="m-title">Master Factor Matrix · Sheet 3</div><div class="m-text">Candidate influencing factors and the equity/access framework gap used to structure the sensitivity analysis.</div></div>
            <div class="method-card"><div class="m-kicker">Operationalization</div><div class="m-title">Factor Operationalization · Sheet 6</div><div class="m-text">Factor definitions, normalization, and the percentile-rank approach used by the composite score.</div></div>
            <div class="method-card"><div class="m-kicker">Current panel</div><div class="m-title">NY-04 · 17,532 structures</div><div class="m-text">Full statewide bridge panel identified in Sheet 15, NYSDOT / data.ny.gov; pulled 2026-09-04.</div></div>
            <div class="method-card"><div class="m-kicker">Validation status</div><div class="m-title">Sensitivity demonstration</div><div class="m-text">Rankings are illustrative until the real influencing-factor datasets are joined and the framework is validated.</div></div>
          </div>
          '''
          if 'method-strip' not in s:
              m = re.search(r'<div[^>]+class=["\']presetbar["\']', s, flags=re.I)
              if not m:
                  raise SystemExit('presetbar method insertion point not found')
              s = s[:m.start()] + method + '\n' + s[m.start():]

          p.write_text(s, encoding='utf-8')
          print('Refined', len(s), 'bytes')
          PY

      - name: Validate application
        run: |
          test -s index.html
          grep -q 'Weight &amp; Influencing-Factor Sensitivity Tool' index.html
          grep -q 'data-status-row' index.html
          grep -q 'method-strip' index.html
          grep -q 'Dr. Wallied Orabi, Associate Professor' index.html
          echo 'Validation passed.'

      - name: Commit updated application
        run: |
          if git diff --quiet -- index.html; then
            echo 'No index.html changes needed.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Refine bridge sensitivity research dashboard'
          git push
